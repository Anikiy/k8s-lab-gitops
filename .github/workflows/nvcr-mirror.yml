name: nvcr-mirror
on:
  workflow_dispatch: {}          # запуск вручную из вкладки Actions
  # schedule: [ {cron: "0 4 * * 1"} ]   # опционально: автообновление раз в неделю

permissions:
  contents: read
  packages: write                # GITHUB_TOKEN получает право пушить в ghcr

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - nvidia/gpu-operator:v26.7.3
          - nvidia/driver:595.91.07-ubuntu24.04      # ОС узла! (22.04/24.04, оба тега 200 на nvcr.io)
          - nvidia/cloud-native/k8s-driver-manager:v0.12.1
          - nvidia/k8s/container-toolkit:v1.20.2
          - nvidia/k8s/dcgm-exporter:4.7.0-4.9.0-distroless
          - nvidia/dra-driver-nvidia-gpu:v0.5.1
    steps:
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Copy nvcr.io -> ghcr.io (all arch, digest-preserving)
        env:
          IMG:   ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ghcr требует lowercase в ПУТИ репозитория (owner «Anikiy» -> «anikiy»);
          # в логине регистр не важен — падает только push/copy:
          #   invalid reference format: repository name must be lowercase
          OWNER="${OWNER,,}"
          echo "$TOKEN" | skopeo login ghcr.io -u "$OWNER" --password-stdin
          skopeo copy --all \
            "docker://nvcr.io/${IMG}" \
            "docker://ghcr.io/${OWNER}/nvcr-mirror/${IMG}"