apiVersion: v1
kind: Namespace
metadata: { name: llm }   # уже существует — kubectl apply пропустит/обновит
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gpu
  namespace: llm
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-qwen
  namespace: llm
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: sglang-qwen }
  template:
    metadata:
      labels: { app: sglang-qwen }
    spec:
      nodeSelector:
        kubernetes.io/hostname: gpu-worker-1
      tolerations:
      - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: single-gpu
      containers:
      - name: sglang
        image: lmsysorg/sglang:v0.5.23
        # ^ docker.io прямой путь у вас медленный; качаем через зеркало и ретагаем (см. ниже)
        args:
        - --model-path=cyankiwi/Qwen3.5-9B-AWQ-4bit
        - --served-model-name=qwen3.5-9b
        - --host=0.0.0.0
        - --port=8000
        - --mem-fraction-static=0.90
        - --context-length=32768
        - --max-running-requests=8
        - --cuda-graph-max-bs=16
        - --schedule-policy=lpm
        - --stream-interval=1
        - --chunked-prefill-size=4096
        - --tool-call-parser=qwen25
        - --enable-metrics
        - --trust-remote-code
        env:
        - { name: HF_HOME, value: /models }
        - { name: OMP_NUM_THREADS, value: "4" }
        resources:
          claims:
          - name: gpu
          requests: { cpu: "2", memory: 4Gi }
          limits: { memory: 8Gi }
        ports:
        - { containerPort: 8000 }
        - { containerPort: 10000 }   # prometheus-метрики (--enable-metrics)
        volumeMounts:
        - { name: models, mountPath: /models }
        - { name: shm, mountPath: /dev/shm }
        startupProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 15
          failureThreshold: 60          # первый старт: + AWQ-декомпрессия + CUDA-graph capture
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          periodSeconds: 30
      volumes:
      - name: models
        hostPath: { path: /var/lib/hf-cache, type: DirectoryOrCreate }  # кеш уже лежит от vllm — веса не перекачиваем
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-qwen
  namespace: llm
spec:
  selector: { app: sglang-qwen }
  ports:
  - { port: 8000, targetPort: 8000 }