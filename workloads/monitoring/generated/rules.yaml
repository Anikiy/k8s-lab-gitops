        group_left(owner_name) topk(1, max(kube_replicaset_owner{job="kube-state-metrics",owner_kind=""})
        by(cluster,replicaset,namespace,owner_name)) by(cluster,replicaset,namespace),
        "workload", "$1", "replicaset", "(.*)")) by(cluster,namespace,workload,pod)
      labels:
        workload_type: replicaset
      record: namespace_workload_pod:kube_pod_owner:relabel
    - expr: max(label_replace(label_replace(kube_pod_owner{job="kube-state-metrics",owner_kind="ReplicaSet"},
        "replicaset", "$1", "owner_name", "(.*)") * on(replicaset,namespace,cluster)
        group_left(owner_name) topk(1, max(kube_replicaset_owner{job="kube-state-metrics",owner_kind="Deployment"})
        by(cluster,replicaset,namespace,owner_name)) by(cluster,replicaset,namespace),
        "workload", "$1", "owner_name", "(.*)")) by(cluster,namespace,workload,pod)
      labels:
        workload_type: deployment
      record: namespace_workload_pod:kube_pod_owner:relabel
    - expr: max(label_replace(kube_pod_owner{job="kube-state-metrics",owner_kind="DaemonSet"},
        "workload", "$1", "owner_name", "(.*)")) by(cluster,namespace,workload,pod)
