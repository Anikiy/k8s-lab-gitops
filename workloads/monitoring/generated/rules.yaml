apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: sync-job
  name: vmks-rule-node-exporter
  namespace: monitoring
spec:
  groups:
  - name: node-exporter
    rules:
    - alert: NodeFilesystemSpaceFillingUp
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          space left and is filling up.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemspacefillingup
        summary: Filesystem is predicted to run out of space within the next 24 hours.
      expr: ((((node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""})
        * 100) < 15) and (predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}[6h],
        86400) < 0)) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 1h
      labels:
        severity: warning
    - alert: NodeFilesystemSpaceFillingUp
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          space left and is filling up fast.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemspacefillingup
        summary: Filesystem is predicted to run out of space within the next 4 hours.
      expr: ((((node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""})
        * 100) < 10) and (predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}[6h],
        14400) < 0)) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 1h
      labels:
        severity: critical
    - alert: NodeFilesystemAlmostOutOfSpace
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          space left.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace
        summary: Filesystem has less than 5% space left.
      expr: (((node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""})
        * 100) < 5) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 30m
      labels:
        severity: warning
    - alert: NodeFilesystemAlmostOutOfSpace
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          space left.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace
        summary: Filesystem has less than 3% space left.
      expr: (((node_filesystem_avail_bytes{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_size_bytes{job="node-exporter",fstype!="",mountpoint!=""})
        * 100) < 3) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 30m
      labels:
        severity: critical
    - alert: NodeFilesystemFilesFillingUp
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          inodes left and is filling up.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemfilesfillingup
        summary: Filesystem is predicted to run out of inodes within the next 24 hours.
      expr: ((((node_filesystem_files_free{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_files{job="node-exporter",fstype!="",mountpoint!=""}) *
        100) < 40) and (predict_linear(node_filesystem_files_free{job="node-exporter",fstype!="",mountpoint!=""}[6h],
        86400) < 0)) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 1h
      labels:
        severity: warning
    - alert: NodeFilesystemFilesFillingUp
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          inodes left and is filling up fast.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemfilesfillingup
        summary: Filesystem is predicted to run out of inodes within the next 4 hours.
      expr: ((((node_filesystem_files_free{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_files{job="node-exporter",fstype!="",mountpoint!=""}) *
        100) < 20) and (predict_linear(node_filesystem_files_free{job="node-exporter",fstype!="",mountpoint!=""}[6h],
        14400) < 0)) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 1h
      labels:
        severity: critical
    - alert: NodeFilesystemAlmostOutOfFiles
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          inodes left.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutoffiles
        summary: Filesystem has less than 5% inodes left.
      expr: (((node_filesystem_files_free{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_files{job="node-exporter",fstype!="",mountpoint!=""}) *
        100) < 5) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 1h
      labels:
        severity: warning
    - alert: NodeFilesystemAlmostOutOfFiles
      annotations:
        description: Filesystem on {{ $labels.device }}, mounted on {{ $labels.mountpoint
          }}, at {{ $labels.instance }} has only {{ printf "%.2f" $value }}% available
          inodes left.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutoffiles
        summary: Filesystem has less than 3% inodes left.
      expr: (((node_filesystem_files_free{job="node-exporter",fstype!="",mountpoint!=""}
        / node_filesystem_files{job="node-exporter",fstype!="",mountpoint!=""}) *
        100) < 3) and (node_filesystem_readonly{job="node-exporter",fstype!="",mountpoint!=""}
        == 0)
      for: 1h
      labels:
        severity: critical
    - alert: NodeNetworkReceiveErrs
      annotations:
        description: '{{ $labels.instance }} interface {{ $labels.device }} has encountered
          {{ printf "%.0f" $value }} receive errors in the last two minutes.'
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodenetworkreceiveerrs
        summary: Network interface is reporting many receive errors.
      expr: (rate(node_network_receive_errs_total{job="node-exporter"}[2m]) / rate(node_network_receive_packets_total{job="node-exporter"}[2m]))
        > 0.01
      for: 1h
      labels:
        severity: warning
    - alert: NodeNetworkTransmitErrs
      annotations:
        description: '{{ $labels.instance }} interface {{ $labels.device }} has encountered
          {{ printf "%.0f" $value }} transmit errors in the last two minutes.'
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodenetworktransmiterrs
        summary: Network interface is reporting many transmit errors.
      expr: (rate(node_network_transmit_errs_total{job="node-exporter"}[2m]) / rate(node_network_transmit_packets_total{job="node-exporter"}[2m]))
        > 0.01
      for: 1h
      labels:
        severity: warning
    - alert: NodeHighNumberConntrackEntriesUsed
      annotations:
        description: '{{ $labels.instance }} {{ $value | humanizePercentage }} of
          conntrack entries are used.'
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodehighnumberconntrackentriesused
        summary: Number of conntrack are getting close to the limit.
      expr: (node_nf_conntrack_entries{job="node-exporter"} / node_nf_conntrack_entries_limit)
        > 0.75
      labels:
        severity: warning
    - alert: NodeTextFileCollectorScrapeError
      annotations:
        description: Node Exporter text file collector on {{ $labels.instance }} failed
          to scrape.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodetextfilecollectorscrapeerror
        summary: Node Exporter text file collector failed to scrape.
      expr: node_textfile_scrape_error{job="node-exporter"} == 1
      labels:
        severity: warning
    - alert: NodeClockSkewDetected
      annotations:
        description: Clock at {{ $labels.instance }} is out of sync by more than 0.05s.
          Ensure NTP is configured correctly on this host.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodeclockskewdetected
        summary: Clock skew detected.
      expr: ((node_timex_offset_seconds{job="node-exporter"} > 0.05) and (deriv(node_timex_offset_seconds{job="node-exporter"}[5m])
        >= 0)) or ((node_timex_offset_seconds{job="node-exporter"} < -0.05) and (deriv(node_timex_offset_seconds{job="node-exporter"}[5m])
        <= 0))
      for: 10m
      labels:
        severity: warning
    - alert: NodeClockNotSynchronising
      annotations:
        description: Clock at {{ $labels.instance }} is not synchronising. Ensure
          NTP is configured on this host.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodeclocknotsynchronising
        summary: Clock not synchronising.
      expr: (min_over_time(node_timex_sync_status{job="node-exporter"}[5m]) == 0)
        and (node_timex_maxerror_seconds{job="node-exporter"} >= 16)
      for: 10m
      labels:
        severity: warning
    - alert: NodeRAIDDegraded
      annotations:
        description: RAID array '{{ $labels.device }}' at {{ $labels.instance }} is
          in degraded state due to one or more disks failures. Number of spare drives
          is insufficient to fix issue automatically.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/noderaiddegraded
        summary: RAID Array is degraded.
      expr: (node_md_disks_required{job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}
        - ignoring(state) node_md_disks{state="active",job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"})
        > 0
      for: 15m
      labels:
        severity: critical
    - alert: NodeRAIDDiskFailure
      annotations:
        description: At least one device in RAID array at {{ $labels.instance }} failed.
          Array '{{ $labels.device }}' needs attention and possibly a disk swap.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/noderaiddiskfailure
        summary: Failed device in RAID array.
      expr: node_md_disks{state="failed",job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}
        > 0
      labels:
        severity: warning
    - alert: NodeFileDescriptorLimit
      annotations:
        description: File descriptors limit at {{ $labels.instance }} is currently
          at {{ printf "%.2f" $value }}%.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefiledescriptorlimit
        summary: Kernel is predicted to exhaust file descriptors limit soon.
      expr: ((node_filefd_allocated{job="node-exporter"} * 100) / node_filefd_maximum{job="node-exporter"})
        > 70
      for: 15m
      labels:
        severity: warning
    - alert: NodeFileDescriptorLimit
      annotations:
        description: File descriptors limit at {{ $labels.instance }} is currently
          at {{ printf "%.2f" $value }}%.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefiledescriptorlimit
        summary: Kernel is predicted to exhaust file descriptors limit soon.
      expr: ((node_filefd_allocated{job="node-exporter"} * 100) / node_filefd_maximum{job="node-exporter"})
        > 90
      for: 15m
      labels:
        severity: critical
    - alert: NodeCPUHighUsage
      annotations:
        description: 'CPU usage at {{ $labels.instance }} has been above 90% for the
          last 15 minutes, is currently at {{ printf "%.2f" $value }}%.

          '
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodecpuhighusage
        summary: High CPU usage.
      expr: (sum(avg(rate(node_cpu_seconds_total{job="node-exporter",mode!~"idle|iowait"}[2m]))
        without(cpu)) without(mode) * 100) > 90
      for: 15m
      labels:
        severity: info
    - alert: NodeSystemSaturation
      annotations:
        description: 'System load per core at {{ $labels.instance }} has been above
          2 for the last 15 minutes, is currently at {{ printf "%.2f" $value }}.

          This might indicate this instance resources saturation and can cause it
          becoming unresponsive.

          '
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemsaturation
        summary: System saturated, load per core is very high.
      expr: (node_load1{job="node-exporter"} / count(node_cpu_seconds_total{job="node-exporter",mode="idle"})
        without(cpu,mode)) > 2
      for: 15m
      labels:
        severity: warning
    - alert: NodeMemoryMajorPagesFaults
      annotations:
        description: 'Memory major pages are occurring at very high rate at {{ $labels.instance
          }}, 500 major page faults per second for the last 15 minutes, is currently
          at {{ printf "%.2f" $value }}.

          Please check that there is enough memory available at this instance.

          '
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememorymajorpagesfaults
        summary: Memory major page faults are occurring at very high rate.
      expr: rate(node_vmstat_pgmajfault{job="node-exporter"}[5m]) > 500
      for: 15m
      labels:
        severity: warning
    - alert: NodeMemoryHighUtilization
      annotations:
        description: 'Memory is filling up at {{ $labels.instance }}, has been above
          90% for the last 15 minutes, is currently at {{ printf "%.2f" $value }}%.

          '
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememoryhighutilization
        summary: Host is running out of memory.
      expr: (100 - ((node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})
        * 100)) > 90
      for: 15m
      labels:
        severity: warning
    - alert: NodeDiskIOSaturation
      annotations:
        description: 'Disk IO queue (aqu-sq) is high on {{ $labels.device }} at {{
          $labels.instance }}, has been above 10 for the last 30 minutes, is currently
          at {{ printf "%.2f" $value }}.

          This symptom might indicate disk saturation.

          '
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodediskiosaturation
        summary: Disk IO queue is high.
      expr: rate(node_disk_io_time_weighted_seconds_total{job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m])
        > 10
      for: 30m
      labels:
        severity: warning
    - alert: NodeSystemdServiceFailed
      annotations:
        description: Systemd service {{ $labels.name }} has entered failed state at
          {{ $labels.instance }}
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemdservicefailed
        summary: Systemd service has entered failed state.
      expr: node_systemd_unit_state{job="node-exporter",state="failed"} == 1
      for: 5m
      labels:
        severity: warning
    - alert: NodeSystemdServiceCrashlooping
      annotations:
        description: Systemd service {{ $labels.name }} has being restarted too many
          times at {{ $labels.instance }} for the last 15 minutes. Please check if
          service is crash looping.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemdservicecrashlooping
        summary: Systemd service keeps restaring, possibly crash looping.
      expr: increase(node_systemd_service_restart_total{job="node-exporter"}[5m])
        > 2
      for: 15m
      labels:
        severity: warning
    - alert: NodeBondingDegraded
      annotations:
        description: Bonding interface {{ $labels.master }} on {{ $labels.instance
          }} is in degraded state due to one or more slave failures.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodebondingdegraded
        summary: Bonding interface is degraded.
      expr: (node_bonding_slaves{job="node-exporter"} - node_bonding_active{job="node-exporter"})
        != 0
      for: 5m
      labels:
        severity: warning
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: sync-job
  name: vmks-rule-node-exporter-rules
  namespace: monitoring
spec:
  groups:
  - name: node-exporter.rules
    rules:
    - expr: count(node_cpu_seconds_total{job="node-exporter",mode="idle"}) without(cpu,mode)
      record: instance:node_num_cpu:sum
    - expr: 1 - avg(sum(rate(node_cpu_seconds_total{job="node-exporter",mode=~"idle|iowait|steal"}[5m]))
        without(mode)) without(cpu)
      record: instance:node_cpu_utilisation:rate5m
    - expr: node_load1{job="node-exporter"} / instance:node_num_cpu:sum{job="node-exporter"}
      record: instance:node_load1_per_cpu:ratio
    - expr: 1 - ((node_memory_MemAvailable_bytes{job="node-exporter"} or (((node_memory_Buffers_bytes{job="node-exporter"}
        + node_memory_Cached_bytes{job="node-exporter"}) + node_memory_MemFree_bytes{job="node-exporter"})
        + node_memory_Slab_bytes{job="node-exporter"})) / node_memory_MemTotal_bytes{job="node-exporter"})
      record: instance:node_memory_utilisation:ratio
    - expr: rate(node_vmstat_pgmajfault{job="node-exporter"}[5m])
      record: instance:node_vmstat_pgmajfault:rate5m
    - expr: rate(node_disk_io_time_seconds_total{job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m])
      record: instance_device:node_disk_io_time_seconds:rate5m
    - expr: rate(node_disk_io_time_weighted_seconds_total{job="node-exporter",device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m])
      record: instance_device:node_disk_io_time_weighted_seconds:rate5m
    - expr: sum(rate(node_network_receive_bytes_total{job="node-exporter",device!="lo"}[5m]))
        without(device)
      record: instance:node_network_receive_bytes_excluding_lo:rate5m
    - expr: sum(rate(node_network_transmit_bytes_total{job="node-exporter",device!="lo"}[5m]))
        without(device)
      record: instance:node_network_transmit_bytes_excluding_lo:rate5m
    - expr: sum(rate(node_network_receive_drop_total{job="node-exporter",device!="lo"}[5m]))
        without(device)
      record: instance:node_network_receive_drop_excluding_lo:rate5m
    - expr: sum(rate(node_network_transmit_drop_total{job="node-exporter",device!="lo"}[5m]))
        without(device)
      record: instance:node_network_transmit_drop_excluding_lo:rate5m
    - expr: sum(rate(node_network_receive_bytes_total{job="node-exporter",device!~"lo|veth.+"}[5m]))
        without(device)
      record: instance:node_network_receive_bytes_physical:rate5m
    - expr: sum(rate(node_network_transmit_bytes_total{job="node-exporter",device!~"lo|veth.+"}[5m]))
        without(device)
      record: instance:node_network_transmit_bytes_physical:rate5m
    - expr: sum(rate(node_network_receive_drop_total{job="node-exporter",device!~"lo|veth.+"}[5m]))
        without(device)
      record: instance:node_network_receive_drop_physical:rate5m
    - expr: sum(rate(node_network_transmit_drop_total{job="node-exporter",device!~"lo|veth.+"}[5m]))
        without(device)
      record: instance:node_network_transmit_drop_physical:rate5m
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: sync-job
  name: vmks-rule-vmagent
  namespace: monitoring
spec:
  groups:
  - concurrency: 2
    interval: 30s
    name: vmagent
    rules:
    - alert: PersistentQueueIsDroppingData
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=49&var-instance={{ $labels.instance
          }}'
        description: Vmagent dropped {{ $value | humanize1024 }} from persistent queue
          on instance {{ $labels.instance }} for the last 10m.
        summary: Instance {{ $labels.instance }} is dropping data from persistent
          queue
      expr: sum(increase(vm_persistentqueue_bytes_dropped_total[5m])) without(path,name)
        > 0
      for: 10m
      labels:
        severity: critical
    - alert: RejectedRemoteWriteDataBlocksAreDropped
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=79&var-instance={{ $labels.instance
          }}'
        description: Job "{{ $labels.job }}" on instance {{ $labels.instance }} drops
          the rejected by remote-write server data blocks. Check the logs to find
          the reason for rejects.
        summary: Vmagent is dropping data blocks that are rejected by remote storage
      expr: sum(increase(vmagent_remotewrite_packets_dropped_total[5m])) without(url)
        > 0
      for: 15m
      labels:
        severity: warning
    - alert: TooManyScrapeErrors
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=31&var-instance={{ $labels.instance
          }}'
        description: Job "{{ $labels.job }}" on instance {{ $labels.instance }} fails
          to scrape targets for last 15m
        summary: Vmagent fails to scrape one or more targets
      expr: increase(vm_promscrape_scrapes_failed_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
    - alert: ScrapePoolHasNoTargets
      annotations:
        description: Vmagent "{{ $labels.job }}" has scrape_pool "{{ $labels.scrape_job
          }}" with 0 discovered targets. It is likely a misconfiguration. Please follow
          https://docs.victoriametrics.com/victoriametrics/vmagent/#debugging-scrape-targets
          to troubleshoot the scraping config.
        summary: Vmagent has scrape_pool with 0 configured/discovered targets
      expr: sum(vm_promscrape_scrape_pool_targets) without(status,instance,pod) ==
        0
      for: 30m
      labels:
        severity: warning
    - alert: TooManyWriteErrors
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=77&var-instance={{ $labels.instance
          }}'
        description: Job "{{ $labels.job }}" on instance {{ $labels.instance }} responds
          with errors to write requests for last 15m.
        summary: Vmagent responds with too many errors on data ingestion protocols
      expr: (sum(increase(vm_ingestserver_request_errors_total[5m])) without(name,net,type)
        + sum(increase(vmagent_http_request_errors_total[5m])) without(path,protocol))
        > 0
      for: 15m
      labels:
        severity: warning
    - alert: TooManyRemoteWriteErrors
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=61&var-instance={{ $labels.instance
          }}'
        description: "Vmagent fails to push data via remote write protocol to destination\
          \ \"{{ $labels.url }}\"\n Ensure that destination is up and reachable."
        summary: Job "{{ $labels.job }}" on instance {{ $labels.instance }} fails
          to push to remote storage
      expr: rate(vmagent_remotewrite_retries_count_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
    - alert: RemoteWriteConnectionIsSaturated
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=84&var-instance={{ $labels.instance
          }}'
        description: "The remote write connection between vmagent \"{{ $labels.job\
          \ }}\" (instance {{ $labels.instance }}) and destination \"{{ $labels.url\
          \ }}\" is saturated by more than 90% and vmagent won't be able to keep up.\n\
          \ There could be the following reasons for this:\n * vmagent can't send\
          \ data fast enough through the existing network connections. Increase `-remoteWrite.queues`\
          \ cmd-line flag value to establish more connections per destination.\n *\
          \ remote destination can't accept data fast enough. Check if remote destination\
          \ has enough resources for processing."
        summary: Remote write connection from "{{ $labels.job }}" (instance {{ $labels.instance
          }}) to {{ $labels.url }} is saturated
      expr: (rate(vmagent_remotewrite_send_duration_seconds_total[5m]) / vmagent_remotewrite_queues)
        > 0.9
      for: 15m
      labels:
        severity: warning
    - alert: PersistentQueueForWritesIsSaturated
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=98&var-instance={{ $labels.instance
          }}'
        description: Persistent queue writes for vmagent "{{ $labels.job }}" (instance
          {{ $labels.instance }}) are saturated by more than 90% and vmagent won't
          be able to keep up with flushing data on disk. In this case, consider to
          decrease load on the vmagent or improve the disk throughput.
        summary: Persistent queue writes for instance {{ $labels.instance }} are saturated
      expr: rate(vm_persistentqueue_write_duration_seconds_total[5m]) > 0.9
      for: 15m
      labels:
        severity: warning
    - alert: PersistentQueueForReadsIsSaturated
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=99&var-instance={{ $labels.instance
          }}'
        description: Persistent queue reads for vmagent "{{ $labels.job }}" (instance
          {{ $labels.instance }}) are saturated by more than 90% and vmagent won't
          be able to keep up with reading data from the disk. In this case, consider
          to decrease load on the vmagent or improve the disk throughput.
        summary: Persistent queue reads for instance {{ $labels.instance }} are saturated
      expr: rate(vm_persistentqueue_read_duration_seconds_total[5m]) > 0.9
      for: 15m
      labels:
        severity: warning
    - alert: SeriesLimitHourReached
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=88&var-instance={{ $labels.instance
          }}'
        description: Max series limit set via -remoteWrite.maxHourlySeries flag is
          close to reaching the max value. Then samples for new time series will be
          dropped instead of sending them to remote storage systems.
        summary: Instance {{ $labels.instance }} reached 90% of the limit
      expr: (vmagent_hourly_series_limit_current_series / vmagent_hourly_series_limit_max_series)
        > 0.9
      labels:
        severity: critical
    - alert: SeriesLimitDayReached
      annotations:
        dashboard: '{{ $externalURL }}/d/G7Z9GzMGz?viewPanel=90&var-instance={{ $labels.instance
          }}'
        description: Max series limit set via -remoteWrite.maxDailySeries flag is
          close to reaching the max value. Then samples for new time series will be
          dropped instead of sending them to remote storage systems.
        summary: Instance {{ $labels.instance }} reached 90% of the limit
      expr: (vmagent_daily_series_limit_current_series / vmagent_daily_series_limit_max_series)
        > 0.9
      labels:
        severity: critical
    - alert: ConfigurationReloadFailure
      annotations:
        description: Configuration hot-reload failed for vmagent on instance {{ $labels.instance
          }}. Check vmagent's logs for detailed error message.
        summary: Configuration reload failed for vmagent instance {{ $labels.instance
          }}
      expr: (vm_promscrape_config_last_reload_successful != 1) or (vmagent_relabel_config_last_reload_successful
        != 1)
      labels:
        severity: warning
    - alert: StreamAggrFlushTimeout
      annotations:
        description: 'Stream aggregation process can''t keep up with the load and
          might produce incorrect aggregation results. Check logs for more details.
          Possible solutions: increase aggregation interval; aggregate smaller number
          of series; reduce samples'' ingestion rate to stream aggregation.'
        summary: Streaming aggregation at "{{ $labels.job }}" (instance {{ $labels.instance
          }}) can't be finished within the configured aggregation interval.
      expr: increase(vm_streamaggr_flush_timeouts_total[5m]) > 0
      labels:
        severity: warning
    - alert: StreamAggrDedupFlushTimeout
      annotations:
        description: 'Deduplication process can''t keep up with the load and might
          produce incorrect results. Check docs https://docs.victoriametrics.com/victoriametrics/stream-aggregation/#deduplication
          and logs for more details. Possible solutions: increase deduplication interval;
          deduplicate smaller number of series; reduce samples'' ingestion rate.'
        summary: Deduplication "{{ $labels.job }}" (instance {{ $labels.instance }})
          can't be finished within configured deduplication interval.
      expr: increase(vm_streamaggr_dedup_flush_timeouts_total[5m]) > 0
      labels:
        severity: warning
    - alert: PersistentQueueRunsOutOfSpaceIn12Hours
      annotations:
        description: RemoteWrite destination ({{ $labels.url }}) is unavailable or
          unable to receive data in a timely manner, so the persistent queue size
          is growing. Once the available space is exhausted, some samples will be
          discarded and cause incident. Please check the health of remoteWrite destination
          ({{ $labels.url }}).
        summary: Persistent Queue (url {{ $labels.url }}) of {{ $labels.instance }}
          (job:{{ $labels.job }}) will run out of space in 12 hours.
      expr: (((sum(vm_persistentqueue_free_disk_space_bytes) by(job,instance,path)
        / (sum(deriv(vm_persistentqueue_bytes_pending[1m])) by(job,instance,path)
        > 0)) * on(job,instance,path) group_left(url) ((vmagent_remotewrite_pending_data_bytes
        * 0) + 1)) < 43200) > 0
      for: 10m
      labels:
        severity: warning
    - alert: PersistentQueueRunsOutOfSpaceIn4Hours
      annotations:
        description: RemoteWrite destination ({{ $labels.url }}) is unavailable or
          unable to receive data in a timely manner, so the persistent queue size
          is growing. Once the available space is exhausted, some samples will be
          discarded and cause incident. Please check the health of remoteWrite destination
          ({{ $labels.url }}).
        summary: Persistent Queue (url {{ $labels.url }}) of {{ $labels.instance }}
          (job:{{ $labels.job }}) will run out of space in 4 hours.
      expr: (((sum(vm_persistentqueue_free_disk_space_bytes) by(job,instance,path)
        / (sum(deriv(vm_persistentqueue_bytes_pending[1m])) by(job,instance,path)
        > 0)) * on(job,instance,path) group_left(url) ((vmagent_remotewrite_pending_data_bytes
        * 0) + 1)) < 14400) > 0
      for: 10m
      labels:
        severity: critical
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: sync-job
  name: vmks-rule-vmalert
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: vmalert
    rules:
    - alert: ConfigurationReloadFailure
      annotations:
        description: Configuration hot-reload failed for vmalert on instance {{ $labels.instance
          }}. Check vmalert's logs for detailed error message.
        summary: Configuration reload failed for vmalert instance {{ $labels.instance
          }}
      expr: vmalert_config_last_reload_successful != 1
      labels:
        severity: warning
    - alert: AlertingRulesError
      annotations:
        dashboard: '{{ $externalURL }}/d/LzldHAVnz?viewPanel=13&var-instance={{ $labels.instance
          }}&var-file={{ $labels.file }}&var-group={{ $labels.group }}'
        description: Alerting rules execution is failing for "{{ $labels.alertname
          }}" from group "{{ $labels.group }}" in file "{{ $labels.file }}". Check
          vmalert's logs for detailed error message.
        summary: Alerting rules are failing for vmalert instance {{ $labels.instance
          }}
      expr: sum(increase(vmalert_alerting_rules_errors_total[5m])) without(id) > 0
      for: 5m
      labels:
        severity: warning
    - alert: RecordingRulesError
      annotations:
        dashboard: '{{ $externalURL }}/d/LzldHAVnz?viewPanel=30&var-instance={{ $labels.instance
          }}&var-file={{ $labels.file }}&var-group={{ $labels.group }}'
        description: Recording rules execution is failing for "{{ $labels.recording
          }}" from group "{{ $labels.group }}" in file "{{ $labels.file }}". Check
          vmalert's logs for detailed error message.
        summary: Recording rules are failing for vmalert instance {{ $labels.instance
          }}
      expr: sum(increase(vmalert_recording_rules_errors_total[5m])) without(id) >
        0
      for: 5m
      labels:
        severity: warning
    - alert: RecordingRulesNoData
      annotations:
        dashboard: '{{ $externalURL }}/d/LzldHAVnz?viewPanel=33&var-file={{ $labels.file
          }}&var-group={{ $labels.group }}'
        description: Recording rule "{{ $labels.recording }}" from group "{{ $labels.group
          }} in file "{{ $labels.file }}" produces 0 samples over the last 30min.
          It might be caused by a misconfiguration or incorrect query expression.
        summary: Recording rule {{ $labels.recording }} ({{ $labels.group }}) produces
          no data
      expr: sum(vmalert_recording_rules_last_evaluation_samples) without(id) < 1
      for: 30m
      labels:
        severity: info
    - alert: TooManyMissedIterations
      annotations:
        description: vmalert instance {{ $labels.instance }} is missing rules evaluations
          for group "{{ $labels.group }}" in file "{{ $labels.file }}". The group
          evaluation time takes longer than the configured evaluation interval. This
          may result in missed alerting notifications or recording rules samples.
          Try increasing evaluation interval or concurrency of group "{{ $labels.group
          }}". See https://docs.victoriametrics.com/victoriametrics/vmalert/#groups.
          If rule expressions are taking longer than expected, please see https://docs.victoriametrics.com/victoriametrics/troubleshooting/#slow-queries.
        summary: vmalert instance {{ $labels.instance }} is missing rules evaluations
      expr: increase(vmalert_iteration_missed_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
    - alert: GroupIterationReset
      annotations:
        description: Evaluation iteration for group "{{ $labels.group }}" in file
          "{{ $labels.file }}" is reset on vmalert instance {{ $labels.instance }}.
          This can be caused by irregular delays during evaluation or by the system
          wall clock being moved backward. If it is caused by host clock changes,
          vmalert could generate duplicate results for the group rules since some
          evaluations could be repeated. Check host clock time synchronization configurations
          if this happens frequently.
        summary: Evaluation iteration for group {{ $labels.group }} in file {{ $labels.file
          }} is reset
      expr: increase(vmalert_iteration_reset_total[5m]) > 0
      for: 5m
      labels:
        severity: warning
    - alert: RemoteWriteErrors
      annotations:
        description: vmalert instance {{ $labels.instance }} is failing to push metrics
          generated via alerting or recording rules to the configured remote write
          URL. Check vmalert's logs for detailed error message.
        summary: vmalert instance {{ $labels.instance }} is failing to push metrics
          to remote write URL
      expr: increase(vmalert_remotewrite_errors_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
    - alert: RemoteWriteDroppingData
      annotations:
        description: vmalert instance {{ $labels.instance }} is failing to send results
          of alerting or recording rules to the configured remote write URL. This
          may result into gaps in recording rules or alerts state. Check vmalert's
          logs for detailed error message.
        summary: vmalert instance {{ $labels.instance }} is dropping data sent to
          remote write URL
      expr: increase(vmalert_remotewrite_dropped_rows_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
    - alert: RemoteWriteQueueHighUsage
      annotations:
        description: 'The remote write queue on vmalert instance {{ $labels.instance
          }} has consistently high utilization. The queue acts as a buffer between
          rules generating series and remote-write client consuming and pushing these
          series. When queue overflows, vmalert will start dropping newly generated
          series. Queue may overflow due to multiple reasons: 1. Some bad rules produce
          too many series at once. This can be limited using the global `-rule.resultsLimit`
          flag or `limit` param at the rule group level. 2. Remote write connection
          is slow.  Increase `-remoteWrite.concurrency`,  so vmalert could establish
          more concurrent connections. 3. The queue size is too small. Increase `-remoteWrite.maxQueueSize`
          to extend the buffer size. Note that a larger queue will result in higher
          memory consumption when the queue is full.'
        summary: Remote write queue capacity on the vmalert instance {{ $labels.instance
          }} has exceeded 80% utilization
      expr: (histogram_quantile(0.99, sum(increase(vmalert_remotewrite_queue_size_bucket[5m]))
        by(job,instance,vmrange)) / vmalert_remotewrite_queue_capacity) > 0.8
      for: 15m
      labels:
        severity: warning
    - alert: AlertmanagerErrors
      annotations:
        description: vmalert instance {{ $labels.instance }} is failing to send alert
          notifications to "{{ $labels.addr }}". Check vmalert's logs for detailed
          error message.
        summary: vmalert instance {{ $labels.instance }} is failing to send notifications
          to Alertmanager
      expr: increase(vmalert_alerts_send_errors_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
    - alert: AlertingRuleResultsApproachingLimit
      annotations:
        description: Alerting rule "{{ $labels.alertname }}" from group "{{ $labels.group
          }}" in file "{{ $labels.file }}" produced {{ $value }} samples in last evaluation,
          which approaches the configured results limit. If the produced results exceed
          the limit, the rule will be marked with an error and all its results will
          be discarded. Try increasing the results limit for the group or reducing
          the number of series produced by the rule. See https://docs.victoriametrics.com/victoriametrics/vmalert/#groups.
        summary: Alerting rule {{ $labels.alertname }} in group {{ $labels.group }}
          is approaching the configured results limit
      expr: (vmalert_alerting_rules_last_evaluation_samples > on(group,file) group_left()
        min(vmalert_group_rule_results_limit * 0.9) by(group,file)) and on(group,file)
        (min(vmalert_group_rule_results_limit) by(group,file) > 0)
      for: 5m
      labels:
        severity: warning
    - alert: RecordingRuleResultsApproachingLimit
      annotations:
        description: Recording rule "{{ $labels.recording }}" from group "{{ $labels.group
          }}" in file "{{ $labels.file }}" produced {{ $value }} samples in last evaluation,
          which approaches the configured results limit. If the produced results exceed
          the limit, the rule will be marked with an error and all its results will
          be discarded. Try increasing the results limit for the group or reducing
          the number of series produced by the rule. See https://docs.victoriametrics.com/victoriametrics/vmalert/#groups.
        summary: Recording rule {{ $labels.recording }} in group {{ $labels.group
          }} is approaching the configured results limit
      expr: (vmalert_recording_rules_last_evaluation_samples > on(group,file) group_left()
        min(vmalert_group_rule_results_limit * 0.9) by(group,file)) and on(group,file)
        (min(vmalert_group_rule_results_limit) by(group,file) > 0)
      for: 5m
      labels:
        severity: warning
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: sync-job
  name: vmks-rule-vmoperator
  namespace: monitoring
spec:
  groups:
  - name: vmoperator
    rules:
    - alert: LogErrors
      annotations:
        dashboard: '{{ $externalURL }}/d/1H179hunk/victoriametrics-operator?ds={{
          $labels.dc }}&orgId=1&viewPanel=16'
        description: 'Operator has too many errors at logs: {{ $value}}, check operator
          logs'
        summary: 'Too many errors at logs of operator: {{ $value}}'
      expr: sum(rate(operator_log_messages_total{level="error",job=~".*((victoria.*)|vm)-?operator"}[5m]))
        by(cluster) > 0
      for: 15m
      labels:
        severity: warning
        show_at: dashboard
    - alert: ReconcileErrors
      annotations:
        dashboard: '{{ $externalURL }}/d/1H179hunk/victoriametrics-operator?ds={{
          $labels.dc }}&orgId=1&viewPanel=10'
        description: 'Operator cannot parse response from k8s api server, possible
          bug: {{ $value }}, check operator logs'
        summary: 'Too many errors at reconcile loop of operator: {{ $value}}'
      expr: sum(rate(controller_runtime_reconcile_errors_total{job=~".*((victoria.*)|vm)-?operator"}[5m]))
        by(cluster) > 0
      for: 10m
      labels:
        severity: warning
        show_at: dashboard
    - alert: HighQueueDepth
      annotations:
        dashboard: '{{ $externalURL }}/d/1H179hunk/victoriametrics-operator?ds={{
          $labels.dc }}&orgId=1&viewPanel=20'
        description: 'Operator cannot handle reconciliation load for controller: `{{-
          $labels.name }}`, current depth: {{ $value }}'
        summary: 'Too many `{{- $labels.name }}` in queue: {{ $value }}'
      expr: sum(workqueue_depth{job=~".*((victoria.*)|vm)-?operator",name=~"(vmagent|vmalert|vmalertmanager|vmauth|vmcluster|vmnodescrape|vmpodscrape|vmprobe|vmrule|vmservicescrape|vmsingle|vmstaticscrape)"})
        by(name,cluster) > 10
      for: 15m
      labels:
        severity: warning
        show_at: dashboard
