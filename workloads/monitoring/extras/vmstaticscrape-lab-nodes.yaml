apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata: { name: lab-postgres, namespace: monitoring }
spec:
  jobName: postgres
  targetEndpoints:
    - targets: ["10.10.10.61:9187","10.10.10.62:9187","10.10.10.63:9187"]
      labels: { cluster: lab-infra, group: lab-db }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata: { name: lab-victoriametrics, namespace: monitoring }
spec:
  jobName: victoriametrics
  targetEndpoints:
    - targets: ["10.10.10.52:8428"]
      path: /metrics
      labels: { cluster: lab-infra, instance: mon-metrics }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata: { name: lab-openbao, namespace: monitoring }
spec:
  jobName: openbao
  targetEndpoints:
    - targets: ["10.10.10.11:8200","10.10.10.12:8200","10.10.10.13:8200"]
      path: /v1/sys/metrics
      params: { format: ["prometheus"] }
      labels: { cluster: lab-infra, group: lab-bao }