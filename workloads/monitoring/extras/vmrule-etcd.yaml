apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata: { name: lab-etcd, namespace: monitoring }
spec:
  groups:
    - name: etcd
      rules:
        - alert: EtcdMemberDown
          expr: up{job=~".*etcd.*"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "etcd {{ $labels.instance }} не скрейпится — проверь :2381 и сервис"

        - alert: EtcdNoLeader
          expr: etcd_server_has_leader == 0
          for: 1m
          labels: { severity: critical }

        - alert: EtcdQuorumAtRisk
          expr: count(up{job=~".*etcd.*"} == 1) < 2
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "Осталось меньше 2 живых etcd — кворум 3-нодового кластера на грани"

        - alert: EtcdLeaderFlapping
          expr: increase(etcd_server_leader_changes_seen_total[10m]) > 3
          labels: { severity: warning }

        - alert: EtcdSlowWalFsync
          expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "p99 fsync WAL > 500ms — диск не тянет" }

        - alert: EtcdSlowBackendCommit
          expr: histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m])) > 0.25
          for: 10m
          labels: { severity: warning }

        - alert: EtcdDbNearQuota
          expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.8
          for: 15m
          labels: { severity: warning }

        - alert: EtcdProposalsPending
          expr: etcd_server_proposals_pending > 10
          for: 5m
          labels: { severity: warning }