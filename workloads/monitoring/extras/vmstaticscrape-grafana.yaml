apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata: { name: grafana-self, namespace: monitoring }
spec:
  jobName: grafana
  targetEndpoints:
    - targets: ["10.10.10.52:3000"]
      path: /metrics
      interval: 30s
      labels: { instance: mon-metrics, group: monitoring }