# gpu-operator: чарт из репо (NGC helm-repo не нужен), values из того же репо через $values
# Паттерн: чарт лежит в workloads/gpu-operator/gpu-operator/, values — workloads/gpu-operator/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
spec:
  project: default
  sources:
    # ref для подстановки $values (тот же репо)
    - repoURL: https://github.com/Anikiy/k8s-lab-gitops.git
      targetRevision: main
      ref: values
    # чарт
    - repoURL: https://github.com/Anikiy/k8s-lab-gitops.git
      targetRevision: main
      path: workloads/gpu-operator/gpu-operator
      helm:
        valueFiles:
          - $values/workloads/gpu-operator/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRD чарта > 262144 bytes — обычный apply падает