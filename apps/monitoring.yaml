apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmks
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://github.com/Anikiy/k8s-lab-gitops.git
      targetRevision: main
      path: workloads/monitoring/victoria-metrics-k8s-stack
      helm:
        releaseName: vmks
        valueFiles:
          - $values/workloads/monitoring/values.yaml
    - repoURL: https://github.com/Anikiy/k8s-lab-gitops.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: monitoring
      name: vmks-victoria-metrics-operator-validation
      jsonPointers: [/data]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: vmks-victoria-metrics-operator-admission
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']